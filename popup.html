<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slideshow Styler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="appbar">
    <img class="logo" src="icons/icon48.png" alt="" width="28" height="28">
    <div class="title">
      <h1>Slideshow Styler</h1>
      <p id="stateText">Google Photos</p>
    </div>
    <label class="switch" title="Enable / disable">
      <input type="checkbox" data-key="enabled" aria-label="Enable Slideshow Styler">
      <span></span>
    </label>
  </header>

  <main>
    <div class="preview" id="preview" aria-hidden="true"></div>

    <section class="card">
      <h2>
        <svg viewBox="0 0 16 16"><path d="M8 1.5l1.7 3.9 4.2.4-3.2 2.8 1 4.1L8 10.5l-3.7 2.2 1-4.1L2.1 5.8l4.2-.4z"/></svg>
        Presets
      </h2>
      <div class="presets" id="presets"></div>
      <div class="presets custom" id="customPresets"></div>
      <button type="button" class="add-preset" id="addPreset">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        Save current as preset
      </button>
      <form class="preset-form" id="presetForm" hidden>
        <input type="text" id="presetName" maxlength="24" placeholder="Preset name" required autocomplete="off">
        <button type="submit" class="primary">Save</button>
        <button type="button" class="ghost" id="presetCancel">Cancel</button>
      </form>
    </section>

    <section class="card">
      <h2>
        <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M2 10.5l3.5-3 3 2.5 2-1.5 3.5 3"/></svg>
        Background
      </h2>
      <div class="segmented" role="radiogroup" aria-label="Background mode">
        <label><input type="radio" name="bgMode" value="solid" data-key="bgMode"><span>Solid</span></label>
        <label><input type="radio" name="bgMode" value="gradient" data-key="bgMode"><span>Gradient</span></label>
        <label><input type="radio" name="bgMode" value="image" data-key="bgMode"><span>Image</span></label>
        <label><input type="radio" name="bgMode" value="blur" data-key="bgMode"><span>Blur</span></label>
      </div>
      <label class="row color" data-modes="solid image">
        <span>Color</span><input type="color" data-key="bgColor"><output></output>
      </label>
      <label class="row color" data-modes="gradient">
        <span>From</span><input type="color" data-key="gradColor1"><output></output>
      </label>
      <label class="row color" data-modes="gradient">
        <span>To</span><input type="color" data-key="gradColor2"><output></output>
      </label>
      <label class="row" data-modes="gradient">
        <span>Angle</span><input type="range" data-key="gradAngle"><output></output>
      </label>
      <label class="row wide" data-modes="image">
        <span>Image URL</span><input type="url" data-key="bgImageUrl" placeholder="https://…">
      </label>
      <label class="row" data-modes="blur">
        <span>Blur</span><input type="range" data-key="blurAmount"><output></output>
      </label>
      <label class="row" data-modes="blur">
        <span>Brightness</span><input type="range" data-key="blurBrightness"><output></output>
      </label>
    </section>

    <section class="card">
      <h2>
        <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5"/><rect x="4.5" y="4.5" width="7" height="7" rx=".5"/></svg>
        Frame
      </h2>
      <label class="row">
        <span>Margin</span><input type="range" data-key="margin"><output></output>
      </label>
      <label class="row">
        <span>Mat</span><input type="range" data-key="matWidth"><output></output>
      </label>
      <label class="row color">
        <span>Mat color</span><input type="color" data-key="matColor"><output></output>
      </label>
      <label class="row">
        <span>Frame</span><input type="range" data-key="frameWidth"><output></output>
      </label>
      <label class="row color">
        <span>Frame color</span><input type="color" data-key="frameColor"><output></output>
      </label>
      <label class="row">
        <span>Corners</span><input type="range" data-key="radius"><output></output>
      </label>
    </section>

    <section class="card">
      <h2>
        <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5"/><path d="M13 5v6.5a1.5 1.5 0 0 1-1.5 1.5H5"/></svg>
        Shadow
      </h2>
      <label class="row">
        <span>Offset X</span><input type="range" data-key="shadowX"><output></output>
      </label>
      <label class="row">
        <span>Offset Y</span><input type="range" data-key="shadowY"><output></output>
      </label>
      <label class="row">
        <span>Blur</span><input type="range" data-key="shadowBlur"><output></output>
      </label>
      <label class="row">
        <span>Spread</span><input type="range" data-key="shadowSpread"><output></output>
      </label>
      <label class="row color">
        <span>Color</span><input type="color" data-key="shadowColor"><output></output>
      </label>
      <label class="row">
        <span>Opacity</span><input type="range" data-key="shadowOpacity"><output></output>
      </label>
    </section>

    <section class="card">
      <h2>
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
        Ambient light
        <span class="switch small">
          <input type="checkbox" data-key="ambEnabled" aria-label="Enable ambient light">
          <span></span>
        </span>
      </h2>
      <p class="hint">Glows behind the photo in the colors of its edges, like a TV backlight.</p>
      <label class="row" data-requires="ambEnabled">
        <span>Intensity</span><input type="range" data-key="ambIntensity"><output></output>
      </label>
      <label class="row" data-requires="ambEnabled">
        <span>Size</span><input type="range" data-key="ambSize"><output></output>
      </label>
      <label class="row" data-requires="ambEnabled">
        <span>Vividness</span><input type="range" data-key="ambSaturation"><output></output>
      </label>
      <label class="row" data-requires="ambEnabled">
        <span>Animation</span><input type="range" data-key="ambSpeed"><output></output>
      </label>
    </section>
  </main>

  <footer>
    <button type="button" class="ghost" id="reset">
      <svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v3h3"/></svg>
      Reset to defaults
    </button>
    <span id="status" role="status"></span>
  </footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
